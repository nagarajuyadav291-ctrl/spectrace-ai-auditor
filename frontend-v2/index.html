<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpecTrace</title>
  <style>
    /* EXACT ChatGPT Styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text-primary: #ececf1;
      --text-secondary: #c5c5d2;
      --bg-primary: #343541;
      --bg-secondary: #444654;
      --bg-input: #40414f;
      --border-color: #565869;
      --accent: #19c37d;
      --accent-hover: #1a7f5a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #202123;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    .sidebar-header {
      padding: 12px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .new-chat-btn:hover {
      background: rgba(255,255,255,0.05);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .chat-item {
      padding: 12px;
      margin-bottom: 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.2s;
    }

    .chat-item:hover {
      background: rgba(255,255,255,0.05);
    }

    .chat-item.active {
      background: rgba(255,255,255,0.1);
      color: var(--text-primary);
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .user-menu:hover {
      background: rgba(255,255,255,0.05);
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Chat Container */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 180px;
    }

    /* Welcome */
    .welcome {
      max-width: 800px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 40px;
      font-weight: 600;
    }

    .examples {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
      margin-top: 40px;
    }

    .example-card {
      padding: 16px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      text-align: left;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .example-card:hover {
      background: rgba(255,255,255,0.08);
    }

    .example-card h3 {
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .example-card p {
      font-size: 14px;
      color: var(--text-primary);
    }

    /* Messages */
    .message {
      padding: 24px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .message.user {
      background: var(--bg-primary);
    }

    .message.assistant {
      background: var(--bg-secondary);
    }

    .message-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      gap: 24px;
    }

    .message-avatar {
      width: 30px;
      height: 30px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    .message.user .message-avatar {
      background: #5436da;
    }

    .message.assistant .message-avatar {
      background: var(--accent);
    }

    .message-text {
      flex: 1;
      line-height: 1.7;
      font-size: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .action-btn {
      padding: 6px 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
    }

    .risk-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }

    .risk-badge.low {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }

    .risk-badge.medium {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
    }

    .risk-badge.high {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    /* Loading */
    .loading {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .loading span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loading span:nth-child(1) { animation-delay: -0.32s; }
    .loading span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input Area */
    .input-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, transparent, var(--bg-primary) 40%);
      padding: 32px 0 24px;
    }

    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .input-container {
      position: relative;
      background: var(--bg-input);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .input-container:focus-within {
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    #messageInput {
      width: 100%;
      padding: 16px 52px 16px 16px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 200px;
      line-height: 1.5;
    }

    #messageInput::placeholder {
      color: var(--text-secondary);
    }

    .send-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 32px;
      height: 32px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .input-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 12px;
    }

    /* Model Selector */
    .model-selector {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .model-selector select {
      padding: 8px 32px 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23ececf1' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }

    /* Safety Panel */
    .safety-panel {
      position: fixed;
      right: -400px;
      top: 0;
      bottom: 0;
      width: 400px;
      background: #202123;
      border-left: 1px solid rgba(255,255,255,0.1);
      transition: right 0.3s;
      overflow-y: auto;
      z-index: 100;
    }

    .safety-panel.open {
      right: 0;
    }

    .safety-header {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: #202123;
      z-index: 1;
    }

    .safety-header h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .close-btn:hover {
      color: var(--text-primary);
    }

    .safety-content {
      padding: 16px;
    }

    .safety-section {
      margin-bottom: 24px;
    }

    .safety-section h4 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .metric {
      background: rgba(255,255,255,0.05);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 700;
    }

    /* Toggle Button */
    .safety-toggle {
      position: fixed;
      right: 20px;
      top: 20px;
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 50;
      transition: all 0.2s;
    }

    .safety-toggle:hover {
      background: rgba(255,255,255,0.1);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.3);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        bottom: 0;
        z-index: 200;
        transition: left 0.3s;
      }

      .sidebar.open {
        left: 0;
      }

      .safety-panel {
        width: 100%;
        right: -100%;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="newChat()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        New chat
      </button>
    </div>
    
    <div class="chat-list" id="chatList">
      <!-- Chat history -->
    </div>
    
    <div class="sidebar-footer">
      <div class="user-menu">
        <div class="avatar">👤</div>
        <span style="font-size: 14px;">User</span>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Model Selector -->
    <div class="model-selector">
      <select id="modelSelect" onchange="updateModel()">
        <optgroup label="🆓 Free Models">
          <option value="llama-3.1-70b-versatile" selected>Llama 3.1 70B</option>
          <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
          <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        </optgroup>
        <optgroup label="💰 Paid Models">
          <option value="gpt-4o">GPT-4o</option>
          <option value="gpt-4-turbo">GPT-4 Turbo</option>
          <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
        </optgroup>
      </select>
    </div>

    <!-- Safety Toggle -->
    <button class="safety-toggle" onclick="toggleSafety()" title="Safety Analysis">
      🛡️
    </button>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
      <!-- Welcome Screen -->
      <div class="welcome" id="welcome">
        <h1>SpecTrace</h1>
        <p style="font-size: 18px; color: var(--text-secondary);">AI Safety Monitor with Real-Time Risk Analysis</p>
        
        <div class="examples">
          <div class="example-card" onclick="setPrompt('What is artificial intelligence?')">
            <h3>💡 Examples</h3>
            <p>What is artificial intelligence?</p>
          </div>
          <div class="example-card" onclick="setPrompt('Explain quantum computing')">
            <h3>🔬 Science</h3>
            <p>Explain quantum computing</p>
          </div>
          <div class="example-card" onclick="setPrompt('What are the risks of AI?')">
            <h3>⚠️ Safety</h3>
            <p>What are the risks of AI?</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <div class="input-container">
          <textarea 
            id="messageInput" 
            placeholder="Send a message..." 
            rows="1"
            onkeydown="handleKeyPress(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <p class="input-hint">SpecTrace monitors AI behavior in real-time</p>
      </div>
    </div>
  </div>

  <!-- Safety Panel -->
  <div class="safety-panel" id="safetyPanel">
    <div class="safety-header">
      <h3>🛡️ Safety Analysis</h3>
      <button class="close-btn" onclick="toggleSafety()">×</button>
    </div>
    <div class="safety-content" id="safetyContent">
      <p style="text-align: center; color: var(--text-secondary); padding: 40px 20px;">
        Send a message to see safety analysis
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
